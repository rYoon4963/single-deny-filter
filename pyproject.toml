[project]
name = "single-deny-filter"
version = "0.1.2"
description = "A logging.Filter that rejects records matching a single logger name substring, functioning as a targeted mute for known-noisy libraries."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
